name: Deploy to Raspberry Pi

on:
  pull_request:
    types: [closed]
    branches: [ main ]

jobs:
  deploy:
    name: Deploy to Pi
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PI_SSH_KEY }}

      - name: Add Pi to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H dashy.local >> ~/.ssh/known_hosts
          ssh-keyscan -H 192.168.1.194 >> ~/.ssh/known_hosts

      - name: Deploy to Pi
        run: |
          echo "🚀 Deploying to Raspberry Pi..."
          ssh rpi4_main@dashy.local << 'EOF'
            set -e
            echo "📦 Pulling latest code..."
            cd ~/dashy
            git pull origin main

            echo "🐳 Building and starting containers..."
            docker compose -f compose/docker-compose.prod.yml up -d --build

            echo "✅ Deployment complete!"
            echo " Container status:"
            docker compose -f compose/docker-compose.prod.yml ps
          EOF

      - name: Verify deployment
        run: |
          echo "⏳ Waiting for services to start..."
          sleep 10

          echo "🔍 Checking frontend..."
          curl -f http://dashy.local || curl -f http://192.168.1.194 || exit 1

          echo "🔍 Checking backend..."
          curl -f http://dashy.local/api/health || curl -f http://192.168.1.194/api/health || exit 1

          echo "✅ Deployment verified!"

      - name: Notify on success
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "✅ Dashy Deployment Success"
          body: |
            Dashy has been successfully deployed to Raspberry Pi.

            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Deployed at: ${{ github.event.head_commit.timestamp }}

            View dashboard: http://dashy.local
          to: ${{ github.event.head_commit.author.email }}
          from: Dashy CI

      - name: Notify on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "❌ Dashy Deployment Failed"
          body: |
            Dashy deployment to Raspberry Pi failed.

            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Error: Check GitHub Actions logs

            View logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          to: ${{ github.event.head_commit.author.email }}
          from: Dashy CI
