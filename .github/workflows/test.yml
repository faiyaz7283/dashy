name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

jobs:
  compose-validation:
    name: Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Create dummy env files for validation
        run: |
          cp env/.env.dev.example env/.env.dev
          cp env/.env.prod.example env/.env.prod

      - name: Validate dev compose
        run: docker compose -f compose/docker-compose.dev.yml config > /dev/null

      - name: Validate prod compose
        run: docker compose -f compose/docker-compose.prod.yml config > /dev/null

  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    needs: compose-validation
    steps:
      - name: Checkout code (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./dashy-kiosk
          file: ./dashy-kiosk/Dockerfile
          push: false
          load: true
          tags: dashy-frontend:test
          build-args: |
            VITE_API_URL=https://api.dashy.local

  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    needs: compose-validation
    steps:
      - name: Checkout code (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./dashy-api
          file: ./dashy-api/Dockerfile
          push: false
          load: true
          tags: dashy-backend:test
