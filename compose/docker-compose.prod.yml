name: dashy-prod

services:
  # Traefik Reverse Proxy
  traefik:
    image: traefik:v3.7
    container_name: dashy-traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/certs:/certs:ro
    networks:
      - dashy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.local`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"

  # PostgreSQL Database
  postgres:
    image: postgres:18-alpine
    container_name: dashy-prod-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres-init-test-db.sql:/docker-entrypoint-initdb.d/10-create-test-db.sql:ro
    networks:
      - dashy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
        -c shared_buffers=128MB
        -c work_mem=4MB
        -c maintenance_work_mem=64MB
        -c max_connections=20
        -c wal_buffers=4MB
        -c checkpoint_completion_target=0.9
        -c log_min_duration_statement=1000
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: dashy-prod-redis
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - dashy-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Kiosk (React + Vite built with Nginx)
  kiosk:
    build:
      context: ../dashy-kiosk
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://api.dashy.local
    container_name: dashy-kiosk
    expose:
      - "80"
    networks:
      - dashy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashy-kiosk.rule=Host(`dashy.local`)"
      - "traefik.http.routers.dashy-kiosk.entrypoints=websecure"
      - "traefik.http.routers.dashy-kiosk.tls=true"
      - "traefik.http.services.dashy-kiosk.loadbalancer.server.port=80"
    restart: unless-stopped

  # API (FastAPI + UV)
  api:
    build:
      context: ../dashy-api
      dockerfile: Dockerfile
    container_name: dashy-api
    env_file:
      - ../env/.env.prod
    expose:
      - "8000"
    volumes:
      - /home/rpi4_main/dashy-504518-355c1ee5c25b.json:/app/credentials/dashy-504518-355c1ee5c25b.json:ro
    environment:
      - REDIS_URL=redis://redis:6379
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - dashy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashy-api.rule=Host(`api.dashy.local`)"
      - "traefik.http.routers.dashy-api.entrypoints=websecure"
      - "traefik.http.routers.dashy-api.tls=true"
      - "traefik.http.services.dashy-api.loadbalancer.server.port=8000"
    restart: unless-stopped

networks:
  dashy-network:
    driver: bridge

volumes:
  redis-data:
  postgres-data:
