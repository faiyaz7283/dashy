name: dashy-dev-v2

services:
  # Redis Cache (shared with v1 — same network)
  redis:
    image: redis:7-alpine
    container_name: dashy-dev-v2-redis
    expose:
      - "6379"
    volumes:
      - redis-data-v2:/data
    networks:
      - dashy-dev-v2-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Kiosk v2 (React + Vite)
  kiosk-v2:
    build:
      context: ../dashy-kiosk-v2
      dockerfile: Dockerfile.dev
    container_name: dashy-dev-kiosk-v2
    expose:
      - "3000"
    volumes:
      - ../dashy-kiosk-v2:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=https://api.dashy.local
      - PNPM_STORE_DIR=/root/.local/share/pnpm/store/v11
      - CI=true
    networks:
      - dashy-dev-v2-network
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashy-dev-kiosk-v2.rule=Host(`dashy-v2.local`)"
      - "traefik.http.routers.dashy-dev-kiosk-v2.entrypoints=websecure"
      - "traefik.http.routers.dashy-dev-kiosk-v2.tls=true"
      - "traefik.http.routers.dashy-dev-kiosk-v2.service=dashy-dev-kiosk-v2"
      - "traefik.http.services.dashy-dev-kiosk-v2.loadbalancer.server.port=3000"
    restart: unless-stopped

  # API (FastAPI + UV) — shared with v1
  api:
    build:
      context: ../dashy-api
      dockerfile: Dockerfile.dev
    container_name: dashy-dev-v2-api
    env_file:
      - ../env/.env.dev
    expose:
      - "8000"
    volumes:
      - ../dashy-api:/app
      - api-data-v2:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=sqlite+aiosqlite:////app/data/dashy.db
    depends_on:
      - redis
    networks:
      - dashy-dev-v2-network
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashy-dev-v2-api.rule=Host(`api.dashy-v2.local`)"
      - "traefik.http.routers.dashy-dev-v2-api.entrypoints=websecure"
      - "traefik.http.routers.dashy-dev-v2-api.tls=true"
      - "traefik.http.routers.dashy-dev-v2-api.service=dashy-dev-v2-api"
      - "traefik.http.services.dashy-dev-v2-api.loadbalancer.server.port=8000"
    restart: unless-stopped

networks:
  dashy-dev-v2-network:
    driver: bridge
  traefik-public:
    external: true

volumes:
  redis-data-v2:
  api-data-v2:
