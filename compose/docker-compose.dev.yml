name: dashy-dev

services:
  # PostgreSQL Database
  postgres:
    image: postgres:18-alpine
    container_name: dashy-dev-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dashy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dashy}
      POSTGRES_DB: ${POSTGRES_DB:-dashy}
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres-init-test-db.sql:/docker-entrypoint-initdb.d/10-create-test-db.sql:ro
    networks:
      - dashy-dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dashy}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: dashy-dev-redis
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - dashy-dev-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Kiosk (React + Vite)
  kiosk:
    build:
      context: ../dashy-kiosk
      dockerfile: Dockerfile.dev
    container_name: dashy-dev-kiosk
    expose:
      - "3000"
    volumes:
      - ../dashy-kiosk:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=https://api.dashy.local
      - PNPM_STORE_DIR=/root/.local/share/pnpm/store/v11
      - CI=true
    networks:
      - dashy-dev-network
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashy-dev-kiosk.rule=Host(`dashy.local`)"
      - "traefik.http.routers.dashy-dev-kiosk.entrypoints=websecure"
      - "traefik.http.routers.dashy-dev-kiosk.tls=true"
      - "traefik.http.routers.dashy-dev-kiosk.service=dashy-dev-kiosk"
      - "traefik.http.services.dashy-dev-kiosk.loadbalancer.server.port=3000"
    restart: unless-stopped

  # API (FastAPI + UV)
  api:
    build:
      context: ../dashy-api
      dockerfile: Dockerfile.dev
    container_name: dashy-dev-api
    env_file:
      - ../env/.env.dev
    expose:
      - "8000"
    volumes:
      - ../dashy-api:/app
      - /Users/admin/Downloads/dashy-504518-355c1ee5c25b.json:/app/credentials/dashy-504518-355c1ee5c25b.json:ro
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379
      - POSTGRES_USER=${POSTGRES_USER:-dashy}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-dashy}
      - POSTGRES_DB=${POSTGRES_DB:-dashy}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - dashy-dev-network
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashy-dev-api.rule=Host(`api.dashy.local`)"
      - "traefik.http.routers.dashy-dev-api.entrypoints=websecure"
      - "traefik.http.routers.dashy-dev-api.tls=true"
      - "traefik.http.routers.dashy-dev-api.service=dashy-dev-api"
      - "traefik.http.services.dashy-dev-api.loadbalancer.server.port=8000"
    restart: unless-stopped

networks:
  dashy-dev-network:
    driver: bridge
  traefik-public:
    external: true

volumes:
  redis-data:
  postgres-data:
